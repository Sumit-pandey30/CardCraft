# ===================================================================
# CardCraft Application Configuration
# ===================================================================

server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=/

# -------------------------------------------------------------------
# Database Configuration (MySQL 8)
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cardcraft_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:sumit}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pooling
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# -------------------------------------------------------------------
# Flyway Database Migration
# -------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

# -------------------------------------------------------------------
# JPA & Hibernate
# Use validate as required once Flyway manages the schema
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Security & JWT Configuration
# -------------------------------------------------------------------
cardcraft.jwt.secret=${JWT_SECRET}
# 24 hours access token expiration (in milliseconds: 86400000)
cardcraft.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# 7 days refresh token expiration (in milliseconds: 604800000)
cardcraft.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# -------------------------------------------------------------------
# Default Admin Seed Configuration
# -------------------------------------------------------------------
cardcraft.admin.email=${ADMIN_EMAIL:admin@cardcraft.io}
cardcraft.admin.password=${ADMIN_PASSWORD:7057d0acc2c92f0115274b3284e20f20}
cardcraft.admin.name=${ADMIN_NAME:CardCraft Administrator}
# -------------------------------------------------------------------
# App URLs
# -------------------------------------------------------------------
cardcraft.app.base-url=${APP_BASE_URL:http://localhost:5173}
cardcraft.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# -------------------------------------------------------------------
# File Upload Configuration
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
